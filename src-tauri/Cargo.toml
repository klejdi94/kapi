[package]
name = "app"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# No "devtools" feature: the web inspector is compiled out of release builds.
# `tauri dev` still gets it, which is where it belongs.
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-websocket = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tiny_http = "0.12.0"
# Direct dependency only for mutual-TLS: plugin-http's fetch() has no client-
# certificate option, so that one case bypasses it for a dedicated reqwest
# client instead. rustls-tls (not native-tls) so `Identity::from_pem` can take
# a plain cert+key PEM bundle, same version reqwest is already pinned to
# transitively — Cargo unifies them rather than linking two TLS stacks.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
# The key that encrypts secret variables at rest lives in the OS credential
# store (macOS Keychain, Windows Credential Manager, Secret Service on Linux).
# The pure-Rust D-Bus backend avoids a libdbus build dependency on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
getrandom = "0.2"

[dev-dependencies]
regex = "1"
