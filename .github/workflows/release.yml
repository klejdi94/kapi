name: release

# Builds on GitHub's own runners rather than locally: DMG creation needs
# hdiutil to mount a disk image, which a local sandboxed dev shell may not be
# able to do, and Windows installers need a Windows host either way.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # One job creates the draft release so the platform jobs below can upload
  # into it in parallel without racing to create it themselves.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            const existing = await github.rest.repos
              .getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag })
              .catch(() => null);
            if (existing) return String(existing.data.id);
            const created = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `kapi ${tag}`,
              draft: true,
              prerelease: false,
            });
            return String(created.data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
