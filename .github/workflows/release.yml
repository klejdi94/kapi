name: release

# Builds on GitHub's own macOS runner rather than locally: DMG creation needs
# hdiutil to mount a disk image, which a local sandboxed dev shell may not be
# able to do, but a normal macOS runner always can.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'kapi ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
