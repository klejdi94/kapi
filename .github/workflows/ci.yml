name: ci

# Runs on every push and PR — the fast checks that catch a regression before
# it ever reaches a tag push and the (much slower, matrix-built) release
# workflow. Nothing here uploads anything; it only has to pass or fail.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The `npx kapi` bundle: it has to build, start, and run a collection
      # (scripts included) end to end, since nothing else exercises the bundle.
      - run: npm run build:npm
      - name: Smoke-test the npm bundle
        run: |
          node npm/dist/kapi.js --version
          node -e "require('http').createServer((q,s)=>{s.setHeader('content-type','application/json');s.end(JSON.stringify({ok:true}))}).listen(18080)" &
          sleep 1
          cat > /tmp/smoke.json <<'JSON'
          {"info":{"name":"smoke","schema":"https://schema.getpostman.com/json/collection/v2.1.0/collection.json"},
           "item":[{"name":"ok","event":[{"listen":"test","script":{"exec":["pm.test('ok', () => pm.expect(pm.response.json().ok).to.be.true);"]}}],
             "request":{"method":"GET","url":"http://127.0.0.1:18080/"}}]}
          JSON
          node npm/dist/kapi.js run /tmp/smoke.json

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The real desktop binary driven through tauri-driver/WebKitWebDriver under
  # a virtual display: native IPC, the CSP, the script sandbox, the keychain
  # and gRPC (against a local reflection server), none of which a browser
  # test can reach.
  desktop-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install the webview, WebDriver, a virtual display and a keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb gnome-keyring dbus-x11
          cargo install tauri-driver --locked
          pip install selenium

      - run: npm ci
      - run: npm ci
        working-directory: e2e/desktop

      - name: Build the app (debug, assets embedded)
        run: npx tauri build --debug --no-bundle

      - name: Desktop end-to-end
        run: xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- e2e/desktop/run.sh

      - name: gRPC against a live server
        run: |
          node e2e/desktop/servers.js &
          sleep 2
          cd src-tauri && KAPI_GRPC_TEST_ADDR=127.0.0.1:50077 cargo test live_tests

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-screenshots
          path: e2e/desktop/shots
          retention-days: 7

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri's Linux build needs these system libs even just to type-check —
      # webkit2gtk and friends are headers/link targets `cargo check` still
      # needs, not runtime-only.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
