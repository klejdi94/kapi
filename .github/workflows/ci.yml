name: ci

# Runs on every push and PR — the fast checks that catch a regression before
# it ever reaches a tag push and the (much slower, matrix-built) release
# workflow. Nothing here uploads anything; it only has to pass or fail.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri's Linux build needs these system libs even just to type-check —
      # webkit2gtk and friends are headers/link targets `cargo check` still
      # needs, not runtime-only.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
