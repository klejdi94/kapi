name: Feature request
description: Suggest something kapi should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In kapi, Postman, curl, or elsewhere.
