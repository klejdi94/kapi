name: Bug report
description: Something in kapi doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a request to …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kapi version
      description: Help → About kapi, or `npx kapi --version` for the CLI.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux, CLI / CI only]
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: The Console panel (⌘` / Ctrl+`) often shows the request, response and any script error. Remove tokens and secrets before pasting.
      render: text
